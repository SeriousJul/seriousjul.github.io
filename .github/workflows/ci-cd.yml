name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Keep the update-notifier -> latest-version -> got -> cacheable-request
  # -> http-cache-semantics path out of CI runs. update-notifier disables
  # itself when this variable is present, so the code path never runs in
  # CI. See docs/adr/0001-no-local-patches-to-third-party-dependencies.md.
  NO_UPDATE_NOTIFIER: "1"

jobs:
  # Gate: fail the build when a dependency in the committed lockfile matches
  # a published advisory. The scanner reads the OSV database, which holds the
  # GitHub advisory database plus more, so it sees every advisory that would
  # raise a GitHub alert. An explicit decision to allow an advisory is
  # recorded in osv-scanner.toml at the repository root, with the analysis
  # that stands behind it, and the scanner reports it as filtered. The gate
  # is its own job, so a red lockfile blocks the deploy below without hiding
  # a red build.
  vulnerability-scan:
    name: Dependency vulnerability gate
    # The called workflow's scan job requests these permissions. The caller
    # must grant each one, or GitHub rejects the workflow_call at startup
    # before any job starts.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=package-lock.json
      # The SARIF upload to code scanning needs security-events: write, which
      # a pull request from a fork does not have. Skip the upload for pull
      # requests so a clean scan cannot fail on it. Pushes to main keep the
      # code scanning entry.
      upload-sarif: ${{ github.event_name == 'push' }}

  build-and-test:
    # No write access: this job installs, checks, builds and tests. Only the
    # deploy job may write to the repository.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Build website
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Upload site build
      # The deploy job publishes exactly this artifact, so what is tested is
      # what is shipped. Only a push to main can reach the deploy job, so the
      # artifact is only produced for one.
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: site-build
        path: build
        retention-days: 1

  # Publish only: the gate passed, the artifact is built and tested, and this
  # is the one job that may write to the repository.
  deploy:
    name: Deploy to GitHub Pages
    needs: [vulnerability-scan, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Download site build
      # The upload step stored the contents of the build directory at the
      # root of the artifact, not the directory itself. Downloading into
      # build recreates the folder the publish step reads.
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: site-build
        path: build

    - name: Publish to gh-pages branch
      # The action clones the publish branch into its own working directory,
      # so this job needs no checkout and no Node toolchain.
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
        publish_branch: gh-pages
        full_commit_message: "Deploy website - ${{ github.sha }}"
        allow_empty_commit: false
